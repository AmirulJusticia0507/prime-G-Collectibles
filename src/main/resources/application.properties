spring.application.name=api
server.port=8093
spring.datasource.url=jdbc:postgresql://localhost:5432/figure_store_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}
app.payment-expiry.interval-ms=60000
app.jwt.secret=${JWT_SECRET:figurevault-local-jwt-secret-change-me-32-bytes}
app.jwt.expires-in-seconds=7200
logging.pattern.level=%5p [requestId=%X{requestId:-}]
midtrans.server-key=${MIDTRANS_SERVER_KEY:SB-Mid-server-xxxx}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:SB-Mid-client-xxxx}
midtrans.is-production=false
