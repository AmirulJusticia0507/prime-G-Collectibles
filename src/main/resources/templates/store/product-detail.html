<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{store/fragments :: head(${product.name})}"></head>
<body class="min-h-screen bg-zinc-100 text-zinc-900">
<nav th:replace="~{store/fragments :: nav}"></nav>
<main class="mx-auto max-w-7xl px-4 py-8 lg:px-8" x-data="{tab:'description'}">
  <div class="overflow-hidden rounded-3xl border border-zinc-200 bg-white shadow-xl shadow-zinc-200/60">
    <div class="grid lg:grid-cols-[1.08fr_.92fr]">
      <section th:replace="~{store/fragments :: gallery(${product})}"></section>
      <section th:replace="~{store/fragments :: purchase(${product})}"></section>
    </div>
    <section th:replace="~{store/fragments :: details(${product})}"></section>
  </div>
</main>
</body>
</html>
