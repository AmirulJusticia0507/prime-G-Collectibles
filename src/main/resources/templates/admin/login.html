<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FigureVault — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center">
<div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded p-6">
  <h1 class="text-lg font-semibold mb-4 text-indigo-400">FigureVault Admin</h1>
  <p th:if="${param.error}" class="mb-3 text-sm text-rose-400">Username atau password salah.</p>
  <p th:if="${param.logout}" class="mb-3 text-sm text-emerald-400">Berhasil logout.</p>
  <form th:action="@{/admin/login}" method="post" class="space-y-3">
    <div>
      <label class="text-sm text-slate-400">Username</label>
      <input name="username" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-3 py-2">
    </div>
    <div>
      <label class="text-sm text-slate-400">Password</label>
      <input type="password" name="password" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-3 py-2">
    </div>
    <button class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-white">Masuk</button>
  </form>
</div>
</body>
</html>
