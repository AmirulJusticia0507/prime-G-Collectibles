<!DOCTYPE html><html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Pelanggan')}"></head><body class="min-h-screen bg-zinc-50 text-zinc-900">
<nav th:replace="~{admin/fragments :: nav}"></nav><main class="mx-auto max-w-7xl px-4 py-8 lg:px-8">
<div th:replace="~{admin/fragments :: feedback}"></div><header class="mb-7"><p class="text-xs font-bold uppercase tracking-[.22em] text-violet-600">Customer access</p><h1 class="mt-1 text-3xl font-black tracking-tight">Pelanggan & tim</h1><p class="mt-2 text-sm text-zinc-500" th:text="${result.totalElements + ' akun terdaftar'}"></p></header>
<form method="post" action="/admin/users" class="panel grid md:grid-cols-5 gap-3 mb-4">
  <input required name="fullName" placeholder="Nama lengkap" class="input"><input required type="email" name="email" placeholder="Email" class="input">
  <input name="phone" placeholder="Telepon" class="input"><input required minlength="8" type="password" name="password" placeholder="Password" class="input">
  <select name="role" class="input"><option>CUSTOMER</option><option>ADMIN</option></select><button class="btn md:col-span-5">Tambah User</button>
</form>
<div class="overflow-x-auto rounded-2xl border border-zinc-200 bg-white shadow-sm"><table class="w-full text-sm"><thead class="border-b border-zinc-200 bg-zinc-50 text-xs uppercase tracking-wider text-zinc-500"><tr><th class="cell">Nama</th><th class="cell">Email</th><th class="cell">Telepon</th><th class="cell">Role</th></tr></thead><tbody>
<tr th:each="u:${result.content}" class="border-b border-zinc-100 transition hover:bg-violet-50/40"><td class="cell font-bold" th:text="${u.fullName}"></td><td class="cell text-zinc-500" th:text="${u.email}"></td><td class="cell text-zinc-500" th:text="${u.phone}"></td><td class="cell"><form method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}" class="flex gap-2"><select name="role" class="input max-w-40"><option th:selected="${u.role=='CUSTOMER'}">CUSTOMER</option><option th:selected="${u.role=='ADMIN'}">ADMIN</option></select><button class="btn">Simpan</button></form></td></tr>
</tbody></table></div><div th:replace="~{admin/fragments :: pager('/admin/users', ${result}, '')}"></div>
</main></body></html>
