<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Products')}"></head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<nav th:replace="~{admin/fragments :: nav}"></nav>
<main class="max-w-7xl mx-auto px-4 py-6" x-data="{ showAdd: false }">
  <div th:replace="~{admin/fragments :: feedback}"></div>
  <div class="flex flex-wrap gap-3 items-center justify-between mb-4">
    <h1 class="text-xl font-semibold">Manajemen Produk</h1>
    <div class="flex gap-2">
      <form method="get" class="flex gap-2"><input name="query" th:value="${query}" placeholder="Nama/manufacturer" class="input"><button class="btn">Cari</button></form>
      <button @click="showAdd=!showAdd" class="btn">Tambah Produk</button>
    </div>
  </div>
  <form x-show="showAdd" x-transition method="post" action="/admin/products" class="panel grid md:grid-cols-4 gap-3 mb-4">
    <input required name="name" placeholder="Nama" class="input"><input name="manufacturer" placeholder="Manufacturer" class="input">
    <input name="scaleType" placeholder="Scale" class="input"><input name="releaseDate" type="date" class="input">
    <input required name="fullPrice" type="number" min="1" placeholder="Harga penuh" class="input">
    <input required name="dpPrice" type="number" min="1" placeholder="DP" class="input">
    <input required name="stockSlot" type="number" min="0" placeholder="Slot" class="input">
    <select name="status" class="input"><option>PO_OPEN</option><option>PO_CLOSED</option><option>READY_STOCK</option></select>
    <button class="btn md:col-span-4">Simpan Produk</button>
  </form>
  <div class="panel overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400">
    <th class="cell">Nama</th><th class="cell">Manufacturer</th><th class="cell">Scale</th><th class="cell">Harga</th><th class="cell">DP</th><th class="cell">Slot</th><th class="cell">Status</th><th class="cell">Aksi</th>
  </tr></thead><tbody>
    <tr th:each="p : ${products}" class="border-t border-slate-800">
      <td class="cell"><input required name="name" th:value="${p.name}" th:attr="form=${'product-'+p.id}" class="input w-44"></td>
      <td class="cell"><input name="manufacturer" th:value="${p.manufacturer}" th:attr="form=${'product-'+p.id}" class="input w-36"></td>
      <td class="cell"><input name="scaleType" th:value="${p.scaleType}" th:attr="form=${'product-'+p.id}" class="input w-20"><input type="hidden" name="releaseDate" th:value="${p.releaseDate}" th:attr="form=${'product-'+p.id}"></td>
      <td class="cell"><input required name="fullPrice" type="number" min="1" th:value="${p.fullPrice}" th:attr="form=${'product-'+p.id}" class="input w-28"></td>
      <td class="cell"><input required name="dpPrice" type="number" min="1" th:value="${p.dpPrice}" th:attr="form=${'product-'+p.id}" class="input w-28"></td>
      <td class="cell"><input required name="stockSlot" type="number" min="0" th:value="${p.stockSlot}" th:attr="form=${'product-'+p.id}" class="input w-20"></td>
      <td class="cell"><select name="status" th:attr="form=${'product-'+p.id}" class="input"><option th:selected="${p.status=='PO_OPEN'}">PO_OPEN</option><option th:selected="${p.status=='PO_CLOSED'}">PO_CLOSED</option><option th:selected="${p.status=='READY_STOCK'}">READY_STOCK</option></select></td>
      <td class="cell whitespace-nowrap"><form method="post" th:id="${'product-'+p.id}" th:action="@{/admin/products/{id}(id=${p.id})}" class="inline"><button class="text-indigo-400 mr-3">Simpan</button></form>
        <form method="post" th:action="@{/admin/products/{id}/delete(id=${p.id})}" class="inline" onsubmit="return confirm('Hapus produk ini?')"><button class="text-rose-400">Hapus</button></form></td>
    </tr>
    <tr th:if="${#lists.isEmpty(products)}"><td colspan="8" class="p-6 text-center text-slate-500">Produk tidak ditemukan.</td></tr>
  </tbody></table></div>
  <div th:replace="~{admin/fragments :: pager('/admin/products', ${result}, 'query=' + ${query})}"></div>
</main></body></html>
